<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Battle 2D - GitHub Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            background: #05050f;
            display: block;
        }

        .ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 4px #000;
        }

        #controls-hint {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="ui-panel">
            <div>⏱️ Waktu: <span id="time">0</span>s</div>
            <div>🏆 Level: <span id="level">1</span></div>
            <div>💥 Skor: <span id="score">0</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div id="controls-hint">
        <b>P1 (Biru):</b> Panah [↑↓←→] & [Space] Tembak | 
        <b>P2 (Hijau):</b> [WASD] & [F] Tembak
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- SISTEM PEMUATAN LOGO GAMBAR (4 LOGO TERINTEGRASI) ---
        const logoSources = [
            'logo1.png', // Gambar 1: ONESANDVOSCHO
            'logo2.png', // Gambar 2: SMKN 1 SANDEN
            'logo3.png', // Gambar 3: MOKO
            'logo4.png'  // Gambar 4: RPL
        ];
        const enemyLogos = [];

        logoSources.forEach(src => {
            const img = new Image();
            img.src = src;
            enemyLogos.push(img);
        });

        // --- AUDIO SYNTHESIZER (Tanpa File Eksternal) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(freq, type = 'sine', duration = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // --- STATE GAME ---
        let gameTime = 0;
        let level = 1;
        let score = 0;
        let gameOver = false;

        // --- CONTROLS ---
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // --- ANIMASI BACKGROUND (STARFIELD) ---
        const stars = Array.from({ length: 60 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 1 + 0.5
        }));

        // --- KARAKTER PEMAIN ---
        class Player {
            constructor(x, y, color, controls) {
                this.x = x;
                this.y = y;
                this.size = 20;
                this.color = color;
                this.speed = 4;
                this.controls = controls;
                this.lastShoot = 0;
            }

            update() {
                if (keys[this.controls.up] && this.y > this.size) this.y -= this.speed;
                if (keys[this.controls.down] && this.y < canvas.height - this.size) this.y += this.speed;
                if (keys[this.controls.left] && this.x > this.size) this.x -= this.speed;
                if (keys[this.controls.right] && this.x < canvas.width - this.size) this.x += this.speed;

                // Tembak
                if (keys[this.controls.shoot] && Date.now() - this.lastShoot > 250) {
                    bullets.push(new Bullet(this.x, this.y - this.size, this.color));
                    playSound(600, 'square', 0.08);
                    this.lastShoot = Date.now();
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
            }
        }

        // --- PELURU ---
        class Bullet {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = 4;
                this.color = color;
                this.speed = 7;
            }

            update() {
                this.y -= this.speed;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- MUSUH (MENGGUNAKAN LOGO GAMBAR) ---
        class Enemy {
            constructor() {
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = -30;
                this.size = 35; // Ukuran logo di canvas
                this.speed = Math.random() * 1.5 + level * 0.5;
                
                // Pilih salah satu dari 4 logo secara acak
                const randomIndex = Math.floor(Math.random() * enemyLogos.length);
                this.image = enemyLogos[randomIndex];
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                
                // Jika gambar logo berhasil dimuat, gambar logo. Jika gagal, gunakan fallback kotak.
                if (this.image && this.image.complete && this.image.naturalWidth !== 0) {
                    ctx.drawImage(
                        this.image, 
                        this.x - this.size / 2, 
                        this.y - this.size / 2, 
                        this.size, 
                        this.size
                    );
                } else {
                    ctx.fillStyle = '#ff0055';
                    ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
                }
            }
        }

        // --- INITIALIZE OBJECTS ---
        const p1 = new Player(300, 420, '#00f0ff', { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', shoot: 'Space' });
        const p2 = new Player(500, 420, '#00ff66', { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', shoot: 'KeyF' });

        let bullets = [];
        let enemies = [];

        // --- TIMING & LEVEL SYSTEM ---
        setInterval(() => {
            if (!gameOver) {
                gameTime++;
                document.getElementById('time').innerText = gameTime;

                // Naik Level Setiap 20 Detik
                if (gameTime % 20 === 0) {
                    level++;
                    document.getElementById('level').innerText = level;
                    playSound(800, 'sine', 0.3); // Suara level up
                }
            }
        }, 1000);

        // Spawn Musuh Berkala
        setInterval(() => {
            if (!gameOver) {
                enemies.push(new Enemy());
            }
        }, 1200);

        // --- MAIN GAME LOOP ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Render Background Animasi (Bintang)
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            if (!gameOver) {
                // 2. Update & Draw Pemain
                p1.update(); p1.draw();
                p2.update(); p2.draw();

                // 3. Peluru Update
                bullets.forEach((bullet, bIndex) => {
                    bullet.update();
                    bullet.draw();

                    // Hapus peluru di luar layar
                    if (bullet.y < 0) bullets.splice(bIndex, 1);
                });

                // 4. Musuh Update & Deteksi Tabrakan
                enemies.forEach((enemy, eIndex) => {
                    enemy.update();
                    enemy.draw();

                    // Cek tabrakan dengan peluru
                    bullets.forEach((bullet, bIndex) => {
                        const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                        if (dist < enemy.size / 2 + bullet.radius) {
                            enemies.splice(eIndex, 1);
                            bullets.splice(bIndex, 1);
                            score += 10;
                            document.getElementById('score').innerText = score;
                            playSound(200, 'sawtooth', 0.05); // Suara hancur
                        }
                    });

                    // Cek tabrakan musuh dengan pemain (Game Over)
                    [p1, p2].forEach(p => {
                        const dist = Math.hypot(p.x - enemy.x, p.y - enemy.y);
                        if (dist < enemy.size / 2 + p.size || enemy.y > canvas.height) {
                            gameOver = true;
                            playSound(100, 'sawtooth', 0.5); // Suara kalah
                        }
                    });
                });

                requestAnimationFrame(animate);
            } else {
                // Tampilan Game Over
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff0055';
                ctx.font = '36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '18px sans-serif';
                ctx.fillText(`Total Skor: ${score} | Bertahan: ${gameTime} Detik`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('Refresh (F5) untuk main lagi', canvas.width / 2, canvas.height / 2 + 60);
            }
        }

        animate();
    </script>
</body>
</html>
